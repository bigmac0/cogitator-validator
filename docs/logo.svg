<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>cogitator-validator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="100%" stop-color="#3a2454"/>
    </linearGradient>
    <radialGradient id="torus" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#f5b54a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b8541f" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Torus halo -->
  <ellipse cx="128" cy="128" rx="92" ry="60" fill="url(#torus)"/>

  <!-- Three concentric loops = H1 = 3 (torus reference Betti) -->
  <ellipse cx="128" cy="128" rx="82" ry="48"
           fill="none" stroke="#f5b54a" stroke-width="2" opacity="0.9"/>
  <ellipse cx="128" cy="128" rx="66" ry="34"
           fill="none" stroke="#e07a3f" stroke-width="2" opacity="0.85"/>
  <ellipse cx="128" cy="128" rx="50" ry="22"
           fill="none" stroke="#c9426a" stroke-width="2" opacity="0.85"/>

  <!-- Eleven checker nodes around the loop -->
  <g fill="#9ad7ff">
    <circle cx="128" cy="68"  r="4.5"/>
    <circle cx="174" cy="80"  r="4.5"/>
    <circle cx="204" cy="112" r="4.5"/>
    <circle cx="212" cy="144" r="4.5"/>
    <circle cx="196" cy="172" r="4.5"/>
    <circle cx="160" cy="188" r="4.5"/>
    <circle cx="118" cy="190" r="4.5"/>
    <circle cx="80"  cy="180" r="4.5"/>
    <circle cx="52"  cy="152" r="4.5"/>
    <circle cx="46"  cy="118" r="4.5"/>
    <circle cx="84"  cy="84"  r="4.5"/>
  </g>

  <!-- Faint VR edges suggesting the 1-skeleton -->
  <g stroke="#9ad7ff" stroke-width="0.6" opacity="0.4" fill="none">
    <line x1="128" y1="68"  x2="174" y2="80"/>
    <line x1="174" y1="80"  x2="204" y2="112"/>
    <line x1="204" y1="112" x2="212" y2="144"/>
    <line x1="212" y1="144" x2="196" y2="172"/>
    <line x1="196" y1="172" x2="160" y2="188"/>
    <line x1="160" y1="188" x2="118" y2="190"/>
    <line x1="118" y1="190" x2="80"  y2="180"/>
    <line x1="80"  y1="180" x2="52"  y2="152"/>
    <line x1="52"  y1="152" x2="46"  y2="118"/>
    <line x1="46"  y1="118" x2="84"  y2="84"/>
    <line x1="84"  y1="84"  x2="128" y2="68"/>
    <line x1="128" y1="68"  x2="160" y2="188"/>
    <line x1="84"  y1="84"  x2="212" y2="144"/>
    <line x1="46"  y1="118" x2="204" y2="112"/>
  </g>

  <!-- Central monogram CV -->
  <text x="128" y="138" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="40" font-weight="bold" fill="#ffffff">CV</text>

  <!-- Subtitle -->
  <text x="128" y="232" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="11" fill="#bcc6e8">cogitator-validator</text>
</svg>
